<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><link rel="stylesheet" href="style.css"></head>
<body class="{{THEME}} {{SHEETCLASS}}">
  {{STATUSBAR}}
  <!-- control center: pulled down anywhere on a top-level page, pull up to close -->
  <!-- pulled out as a sheet: no back button, the reverse pull closes it;
       opened from a page (act:sub): the back button returns -->
  <div class="subtop">
    <a href="act:backfunc" class="subback">返回</a>
    <span class="subname">控制中心</span>
  </div>

  <div class="cc-grid">
    <a href="act:wifi" class="ccb {{WIFICLASS}}"><span class="ccc" id="cc-wifi"></span><span class="ccl">Wi-Fi</span></a>
    <a href="act:nfc" class="ccb {{NFCCLASS}}"><span class="ccc" id="cc-nfc"></span><span class="ccl">NFC</span></a>
    <a href="act:dps" class="ccb {{DPSCLASS}}"><span class="ccc" id="cc-dps"></span><span class="ccl">直供电</span></a>
    <a href="act:theme" class="ccb"><span class="ccc" id="cc-theme"></span><span class="ccl">{{THEMESTATE}}</span></a>
  </div>
  <!-- TopFlow: aggregation, fan always-on and liquid cooling; empty elsewhere -->
  {{CCEXTRA}}

  <div class="card">
    <div class="row tfonly">
      <span class="lab">自动亮度<span class="st">跟随环境光调节</span></span>
      <span class="ctrl"><a href="act:autobright" class="sw {{AUTOBRIGHTCLASS}}"><span class="kn"></span></a></span>
    </div>
    <div class="srow"><span>亮度</span><span class="sval">{{BRIGHT}}%</span></div>
    <a href="act:bright" id="bright-bar" class="slider {{BRIGHTBAR}}"><span class="sfill" style="width:{{BRIGHT}}%"></span></a>
    <div class="srow"><span>自动息屏</span></div>
    {{AUTOOFF}}
  </div>

  <a href="act:menu" class="card valrow"><span class="vk">电源</span><span class="vv muted">关机 / 重启</span></a>

  <div class="sheet-hint">上滑收起</div>
  {{TOAST}}
</body>
</html>
